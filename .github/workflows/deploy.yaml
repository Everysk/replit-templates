name: Deploy App

on:
  # push:
    # branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EVERYSK_API_URL_DOMAIN: ${{ vars.EVERYSK_API_URL_DOMAIN || 'api.everysk.com' }}
      EVERYSK_API_SID: ${{ secrets.EVERYSK_API_SID }}
      EVERYSK_API_TOKEN: ${{ secrets.EVERYSK_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy
        run: ./scripts/deploy.sh
